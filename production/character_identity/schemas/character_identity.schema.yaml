schema_version: "1.0"

statuses:
  - REFERENCE_PENDING
  - REVIEW
  - APPROVED
  - RETIRED

required_reference_views:
  - front
  - three_quarter
  - profile
  - full_body

hash_algorithm: "sha256"

rules:
  canonical_master_required: true
  text_only_after_approval: false
  generated_frame_as_master_reference: false
  previous_episode_frame_as_master_reference: false
  reference_chaining: false
  identity_validation_required: true


reference_sheet_text_policy:
  incidental_text_is_identity: false
  readable_text_default: "OMIT_UNLESS_SCRIPT_REQUIRED"
  signage_default: "OMIT_UNLESS_SCRIPT_REQUIRED"
  invented_scene_text_allowed: false
  approved_identity_symbols_allowed: true

canonical_master_reference_policy:
  multi_view_master_sheet_allowed: true
  standalone_view_files_always_required: false
  master_sheet_may_satisfy_view_coverage: true
  sha256_required_for_approved_master: true
  generated_scene_may_replace_master: false
